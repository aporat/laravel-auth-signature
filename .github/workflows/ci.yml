# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  ################################################################################
  # LINTING JOB: Runs once to check for code style issues.
  ################################################################################
  lint:
    name: "PHP Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2

      - name: Install Dependencies
        uses: ramsey/composer-install@v4

      - name: Execute linter (Pint)
        run: composer lint

  ################################################################################
  # STATIC ANALYSIS JOB: Runs PHPStan to check for type errors.
  ################################################################################
  analyse:
    name: "Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2

      - name: Install Dependencies
        uses: ramsey/composer-install@v4

      - name: Execute static analysis (PHPStan)
        run: composer analyse

  ################################################################################
  # TESTING JOB: Runs against a matrix of PHP and Laravel versions.
  ################################################################################
  tests:
    name: "P${{ matrix.php }} | L${{ matrix.laravel }}"
    needs: [lint, analyse]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5]
        laravel: [12.*, 13.*]
        include:
          - laravel: 12.*
            testbench: ^10.0
          - laravel: 13.*
            testbench: ^11.0
          # Coverage is collected in a single lane; the others run without a driver.
          - php: 8.5
            laravel: 13.*
            coverage: xdebug

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, openssl
          coverage: ${{ matrix.coverage || 'none' }}
          tools: composer:v2

      # There is no committed composer.lock, so without this every lane would
      # resolve the newest Laravel the constraints allow.
      - name: Select Laravel ${{ matrix.laravel }}
        run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction

      # Resolves and installs the selected versions. Its cache of Composer
      # downloads is keyed on the (now lane-specific) composer.json.
      - name: Install Dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Show installed versions
        run: composer show | grep -E '^(laravel/framework|orchestra/testbench|phpunit/phpunit) '

      - name: Execute tests (PHPUnit)
        if: matrix.coverage != 'xdebug'
        run: composer test

      - name: Execute tests with coverage (PHPUnit)
        if: matrix.coverage == 'xdebug'
        run: composer test-ci

      - name: Upload coverage to Codecov
        if: matrix.coverage == 'xdebug'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ matrix.coverage == 'xdebug' && !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
